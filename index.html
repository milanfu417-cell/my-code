<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>食物保存期限提醒</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const STORAGE_ITEMS_KEY = "food-expiry:items";
const STORAGE_CATEGORIES_KEY = "food-expiry:categories";

const DEFAULT_CATEGORIES = [
  { name: "醬料", icon: "🧂" },
  { name: "蔬果", icon: "🥦" },
  { name: "肉類", icon: "🥩" },
  { name: "乳製品", icon: "🥛" },
  { name: "罐頭", icon: "🥫" },
  { name: "其他", icon: "📦" },
];

const QUICK_DAYS = [3, 7, 14, 30, 90];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayStr() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return toDateInputValue(d);
}

function toDateInputValue(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function addDays(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + Number(days));
  return toDateInputValue(d);
}

function daysLeftFor(expiryDate) {
  const today = new Date(todayStr() + "T00:00:00");
  const expiry = new Date(expiryDate + "T00:00:00");
  return Math.round((expiry - today) / 86400000);
}

function urgencyInfo(daysLeft) {
  if (daysLeft < 0) {
    return {
      key: "expired",
      label: `已過期 ${Math.abs(daysLeft)} 天`,
      border: "border-red-400",
      chip: "bg-red-100 text-red-700",
      dot: "bg-red-500",
      ring: "ring-red-200",
    };
  }
  if (daysLeft <= 7) {
    return {
      key: "urgent",
      label: daysLeft === 0 ? "今天到期" : `剩餘 ${daysLeft} 天`,
      border: "border-orange-400",
      chip: "bg-orange-100 text-orange-700",
      dot: "bg-orange-500",
      ring: "ring-orange-200",
    };
  }
  if (daysLeft <= 14) {
    return {
      key: "soon",
      label: `剩餘 ${daysLeft} 天`,
      border: "border-yellow-400",
      chip: "bg-yellow-100 text-yellow-700",
      dot: "bg-yellow-500",
      ring: "ring-yellow-200",
    };
  }
  return {
    key: "safe",
    label: `剩餘 ${daysLeft} 天`,
    border: "border-green-400",
    chip: "bg-green-100 text-green-700",
    dot: "bg-green-500",
    ring: "ring-green-200",
  };
}

function loadItems() {
  try {
    const raw = localStorage.getItem(STORAGE_ITEMS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function loadCategories() {
  try {
    const raw = localStorage.getItem(STORAGE_CATEGORIES_KEY);
    return raw ? JSON.parse(raw) : DEFAULT_CATEGORIES;
  } catch (e) {
    return DEFAULT_CATEGORIES;
  }
}

function CategoryChip({ active, icon, name, onClick, onRemove }) {
  return (
    <button
      type="button"
      onClick={onClick}
      className={
        "flex items-center gap-1 whitespace-nowrap rounded-full px-3 py-1.5 text-sm font-medium border transition " +
        (active
          ? "bg-slate-900 text-white border-slate-900"
          : "bg-white text-slate-600 border-slate-200 hover:border-slate-300")
      }
    >
      <span>{icon}</span>
      <span>{name}</span>
      {onRemove && (
        <span
          onClick={(e) => {
            e.stopPropagation();
            onRemove();
          }}
          className="ml-1 text-slate-400 hover:text-red-500"
        >
          ✕
        </span>
      )}
    </button>
  );
}

function ItemCard({ item, onEdit, onDelete }) {
  const daysLeft = daysLeftFor(item.expiryDate);
  const u = urgencyInfo(daysLeft);
  return (
    <div
      className={
        "rounded-2xl bg-white shadow-sm border-l-4 p-4 flex flex-col gap-2 ring-1 " +
        u.border +
        " " +
        u.ring
      }
    >
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <h3 className="font-semibold text-slate-900 truncate">{item.name}</h3>
            <span className="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">
              {item.categoryIcon} {item.category}
            </span>
          </div>
          <div className="mt-1 text-xs text-slate-400 flex flex-wrap gap-x-3 gap-y-0.5">
            {item.purchaseDate && <span>購買/開封：{item.purchaseDate}</span>}
            <span>到期：{item.expiryDate}</span>
          </div>
        </div>
        <span
          className={"shrink-0 flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-semibold " + u.chip}
        >
          <span className={"w-1.5 h-1.5 rounded-full " + u.dot}></span>
          {u.label}
        </span>
      </div>
      <div className="flex justify-end gap-2 pt-1">
        <button
          onClick={() => onEdit(item)}
          className="text-sm px-3 py-1.5 rounded-lg text-slate-600 hover:bg-slate-100"
        >
          編輯
        </button>
        <button
          onClick={() => onDelete(item)}
          className="text-sm px-3 py-1.5 rounded-lg text-red-500 hover:bg-red-50"
        >
          刪除
        </button>
      </div>
    </div>
  );
}

function ItemFormModal({ open, onClose, onSave, categories, onAddCategory, editingItem }) {
  const isEdit = !!editingItem;
  const [name, setName] = useState("");
  const [category, setCategory] = useState(categories[0]?.name || "");
  const [purchaseDate, setPurchaseDate] = useState("");
  const [expiryMode, setExpiryMode] = useState("date"); // "date" | "days"
  const [expiryDate, setExpiryDate] = useState(todayStr());
  const [expiryDays, setExpiryDays] = useState("7");
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCategoryName, setNewCategoryName] = useState("");
  const [error, setError] = useState("");
  const nameInputRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    if (editingItem) {
      setName(editingItem.name);
      setCategory(editingItem.category);
      setPurchaseDate(editingItem.purchaseDate || "");
      setExpiryMode("date");
      setExpiryDate(editingItem.expiryDate);
      setExpiryDays("7");
    } else {
      setName("");
      setCategory(categories[0]?.name || "");
      setPurchaseDate("");
      setExpiryMode("date");
      setExpiryDate(todayStr());
      setExpiryDays("7");
    }
    setAddingCategory(false);
    setNewCategoryName("");
    setError("");
    setTimeout(() => nameInputRef.current && nameInputRef.current.focus(), 50);
  }, [open, editingItem]);

  if (!open) return null;

  const resolvedExpiryDate =
    expiryMode === "days" && expiryDays !== ""
      ? addDays(todayStr(), expiryDays)
      : expiryDate;

  function handleConfirmNewCategory() {
    const trimmed = newCategoryName.trim();
    if (!trimmed) {
      setAddingCategory(false);
      return;
    }
    onAddCategory(trimmed);
    setCategory(trimmed);
    setNewCategoryName("");
    setAddingCategory(false);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!name.trim()) {
      setError("請輸入食物名稱");
      return;
    }
    if (!category) {
      setError("請選擇分類");
      return;
    }
    if (!resolvedExpiryDate) {
      setError("請設定保存期限");
      return;
    }
    const chosenCategory = categories.find((c) => c.name === category);
    onSave({
      id: editingItem ? editingItem.id : uid(),
      name: name.trim(),
      category: category,
      categoryIcon: chosenCategory ? chosenCategory.icon : "🏷️",
      purchaseDate: purchaseDate || "",
      expiryDate: resolvedExpiryDate,
    });
  }

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm">
      <div className="w-full sm:max-w-md bg-white rounded-t-3xl sm:rounded-2xl p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))] max-h-[92vh] overflow-y-auto shadow-xl">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg font-bold text-slate-900">
            {isEdit ? "編輯食物" : "新增食物"}
          </h2>
          <button
            onClick={onClose}
            className="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100"
          >
            ✕
          </button>
        </div>

        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">名稱</label>
            <input
              ref={nameInputRef}
              type="text"
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="例：番茄醬、雞胸肉…"
              className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
            />
          </div>

          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">分類</label>
            <div className="flex flex-wrap gap-2">
              {categories.map((c) => (
                <CategoryChip
                  key={c.name}
                  icon={c.icon}
                  name={c.name}
                  active={category === c.name}
                  onClick={() => setCategory(c.name)}
                />
              ))}
              {!addingCategory ? (
                <button
                  type="button"
                  onClick={() => setAddingCategory(true)}
                  className="rounded-full px-3 py-1.5 text-sm font-medium border border-dashed border-slate-300 text-slate-500 hover:border-slate-400"
                >
                  ＋ 自訂分類
                </button>
              ) : (
                <div className="flex items-center gap-1">
                  <input
                    autoFocus
                    type="text"
                    value={newCategoryName}
                    onChange={(e) => setNewCategoryName(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === "Enter") {
                        e.preventDefault();
                        handleConfirmNewCategory();
                      }
                    }}
                    placeholder="新分類名稱"
                    className="rounded-full border border-slate-300 px-3 py-1.5 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-slate-900"
                  />
                  <button
                    type="button"
                    onClick={handleConfirmNewCategory}
                    className="rounded-full px-2.5 py-1.5 text-sm bg-slate-900 text-white"
                  >
                    ✓
                  </button>
                </div>
              )}
            </div>
          </div>

          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">
              開封／購買日期（選填）
            </label>
            <input
              type="date"
              value={purchaseDate}
              onChange={(e) => setPurchaseDate(e.target.value)}
              className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
            />
          </div>

          <div>
            <div className="flex items-center justify-between mb-1">
              <label className="block text-sm font-medium text-slate-600">保存期限</label>
              <div className="flex rounded-lg bg-slate-100 p-0.5 text-xs font-medium">
                <button
                  type="button"
                  onClick={() => setExpiryMode("date")}
                  className={
                    "px-2.5 py-1 rounded-md transition " +
                    (expiryMode === "date" ? "bg-white shadow text-slate-900" : "text-slate-500")
                  }
                >
                  選擇日期
                </button>
                <button
                  type="button"
                  onClick={() => setExpiryMode("days")}
                  className={
                    "px-2.5 py-1 rounded-md transition " +
                    (expiryMode === "days" ? "bg-white shadow text-slate-900" : "text-slate-500")
                  }
                >
                  剩餘天數
                </button>
              </div>
            </div>

            {expiryMode === "date" ? (
              <input
                type="date"
                value={expiryDate}
                onChange={(e) => setExpiryDate(e.target.value)}
                className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
              />
            ) : (
              <div>
                <div className="flex flex-wrap gap-2 mb-2">
                  {QUICK_DAYS.map((d) => (
                    <button
                      key={d}
                      type="button"
                      onClick={() => setExpiryDays(String(d))}
                      className={
                        "rounded-full px-3 py-1.5 text-sm font-medium border " +
                        (String(d) === expiryDays
                          ? "bg-slate-900 text-white border-slate-900"
                          : "bg-white text-slate-600 border-slate-200")
                      }
                    >
                      {d} 天
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    min="0"
                    value={expiryDays}
                    onChange={(e) => setExpiryDays(e.target.value)}
                    className="w-24 rounded-xl border border-slate-200 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
                  />
                  <span className="text-sm text-slate-500">
                    天後到期（{resolvedExpiryDate || "--"}）
                  </span>
                </div>
              </div>
            )}
          </div>

          {error && <p className="text-sm text-red-500">{error}</p>}

          <div className="flex gap-3 pt-2">
            <button
              type="button"
              onClick={onClose}
              className="flex-1 rounded-xl border border-slate-200 py-3 text-slate-600 font-medium"
            >
              取消
            </button>
            <button
              type="submit"
              className="flex-1 rounded-xl bg-slate-900 text-white py-3 font-medium"
            >
              儲存
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

function ConfirmDeleteModal({ item, onCancel, onConfirm }) {
  if (!item) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm px-6">
      <div className="w-full sm:max-w-sm bg-white rounded-2xl p-5 shadow-xl">
        <h3 className="font-bold text-slate-900 mb-1">刪除「{item.name}」？</h3>
        <p className="text-sm text-slate-500 mb-4">此操作無法復原。</p>
        <div className="flex gap-3">
          <button
            onClick={onCancel}
            className="flex-1 rounded-xl border border-slate-200 py-2.5 text-slate-600 font-medium"
          >
            取消
          </button>
          <button
            onClick={onConfirm}
            className="flex-1 rounded-xl bg-red-500 text-white py-2.5 font-medium"
          >
            刪除
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [items, setItems] = useState(loadItems);
  const [categories, setCategories] = useState(loadCategories);
  const [search, setSearch] = useState("");
  const [filterCategory, setFilterCategory] = useState("全部");
  const [formOpen, setFormOpen] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [deletingItem, setDeletingItem] = useState(null);

  useEffect(() => {
    localStorage.setItem(STORAGE_ITEMS_KEY, JSON.stringify(items));
  }, [items]);

  useEffect(() => {
    localStorage.setItem(STORAGE_CATEGORIES_KEY, JSON.stringify(categories));
  }, [categories]);

  function handleAddCategory(name) {
    setCategories((prev) => {
      if (prev.some((c) => c.name === name)) return prev;
      return [...prev, { name, icon: "🏷️" }];
    });
  }

  function handleSaveItem(item) {
    setItems((prev) => {
      const exists = prev.some((i) => i.id === item.id);
      if (exists) return prev.map((i) => (i.id === item.id ? item : i));
      return [...prev, item];
    });
    setFormOpen(false);
    setEditingItem(null);
  }

  function handleDeleteConfirmed() {
    setItems((prev) => prev.filter((i) => i.id !== deletingItem.id));
    setDeletingItem(null);
  }

  const filteredSorted = useMemo(() => {
    return items
      .filter((i) => (filterCategory === "全部" ? true : i.category === filterCategory))
      .filter((i) => i.name.toLowerCase().includes(search.trim().toLowerCase()))
      .slice()
      .sort((a, b) => daysLeftFor(a.expiryDate) - daysLeftFor(b.expiryDate));
  }, [items, filterCategory, search]);

  const expiredCount = items.filter((i) => daysLeftFor(i.expiryDate) < 0).length;
  const urgentCount = items.filter((i) => {
    const d = daysLeftFor(i.expiryDate);
    return d >= 0 && d <= 7;
  }).length;

  return (
    <div className="min-h-screen pb-28">
      <header className="sticky top-0 z-30 bg-slate-100/90 backdrop-blur-sm pt-[env(safe-area-inset-top)]">
        <div className="max-w-2xl mx-auto px-4 pt-4 pb-3">
          <div className="flex items-center justify-between mb-3">
            <h1 className="text-xl font-bold text-slate-900">🍽️ 保存期限提醒</h1>
            {items.length > 0 && (
              <div className="flex gap-2 text-xs font-medium">
                {expiredCount > 0 && (
                  <span className="px-2 py-1 rounded-full bg-red-100 text-red-700">
                    已過期 {expiredCount}
                  </span>
                )}
                {urgentCount > 0 && (
                  <span className="px-2 py-1 rounded-full bg-orange-100 text-orange-700">
                    快到期 {urgentCount}
                  </span>
                )}
              </div>
            )}
          </div>

          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="搜尋食物名稱…"
            className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900 mb-3"
          />

          <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
            <CategoryChip
              icon="🗂️"
              name="全部"
              active={filterCategory === "全部"}
              onClick={() => setFilterCategory("全部")}
            />
            {categories.map((c) => (
              <CategoryChip
                key={c.name}
                icon={c.icon}
                name={c.name}
                active={filterCategory === c.name}
                onClick={() => setFilterCategory(c.name)}
              />
            ))}
          </div>
        </div>
      </header>

      <main className="max-w-2xl mx-auto px-4 pt-2">
        {filteredSorted.length === 0 ? (
          <div className="text-center py-20 text-slate-400">
            <div className="text-4xl mb-3">🧺</div>
            <p className="font-medium">
              {items.length === 0 ? "目前沒有任何食物" : "沒有符合條件的項目"}
            </p>
            {items.length === 0 && (
              <p className="text-sm mt-1">點擊右下角「＋」新增第一項食物</p>
            )}
          </div>
        ) : (
          <div className="flex flex-col gap-3">
            {filteredSorted.map((item) => (
              <ItemCard
                key={item.id}
                item={item}
                onEdit={(i) => {
                  setEditingItem(i);
                  setFormOpen(true);
                }}
                onDelete={(i) => setDeletingItem(i)}
              />
            ))}
          </div>
        )}
      </main>

      <button
        onClick={() => {
          setEditingItem(null);
          setFormOpen(true);
        }}
        className="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-slate-900 text-white text-2xl shadow-lg flex items-center justify-center hover:bg-slate-800 active:scale-95 transition"
        aria-label="新增食物"
      >
        ＋
      </button>

      <ItemFormModal
        open={formOpen}
        editingItem={editingItem}
        categories={categories}
        onAddCategory={handleAddCategory}
        onClose={() => {
          setFormOpen(false);
          setEditingItem(null);
        }}
        onSave={handleSaveItem}
      />

      <ConfirmDeleteModal
        item={deletingItem}
        onCancel={() => setDeletingItem(null)}
        onConfirm={handleDeleteConfirmed}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
