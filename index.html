<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cube Dash Jr.</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Comic Sans MS', 'Trebuchet MS', Arial, sans-serif;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
    }

    #gameWrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
    }

    canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 720 / 480;
        background: #4fc3f7;
        touch-action: none;
        border-radius: 8px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    #score {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 26px;
        font-weight: bold;
        color: #fff;
        background: rgba(0,0,0,0.35);
        padding: 6px 22px;
        border-radius: 20px;
        pointer-events: none;
        z-index: 5;
    }

    #hint {
        position: absolute;
        top: 62px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 15px;
        font-weight: bold;
        color: #fff;
        background: rgba(0,0,0,0.3);
        padding: 4px 16px;
        border-radius: 14px;
        pointer-events: none;
        z-index: 5;
        transition: opacity 0.5s;
    }

    #gameOverScreen {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(20,10,40,0.6);
        color: #fff;
        text-align: center;
        z-index: 10;
    }

    #gameOverScreen.show { display: flex; }

    #gameOverScreen h1 {
        font-size: 46px;
        margin: 0 0 6px 0;
        text-shadow: 0 3px 0 rgba(0,0,0,0.3);
    }

    #gameOverScreen p {
        font-size: 22px;
        margin: 4px 0 20px 0;
    }

    #tryAgainBtn {
        font-size: 30px;
        font-weight: bold;
        color: #fff;
        background: linear-gradient(180deg, #ff6b6b, #e63946);
        border: 5px solid #fff;
        border-radius: 50px;
        padding: 22px 50px;
        box-shadow: 0 6px 0 rgba(0,0,0,0.3);
        cursor: pointer;
        touch-action: none;
        z-index: 11;
    }

    #tryAgainBtn:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
</style>
</head>
<body>
<div id="gameWrap">
    <canvas id="game" width="720" height="480"></canvas>
    <div id="score">Score: 0</div>
    <div id="hint">TAP to jump &middot; HOLD to climb stairs</div>
    <div id="gameOverScreen">
        <h1>&#128165; Oops! &#128165;</h1>
        <p id="finalScore">Score: 0</p>
        <button id="tryAgainBtn">Try Again!</button>
    </div>
</div>

<script>
(function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('gameWrap');
    const scoreEl = document.getElementById('score');
    const hintEl = document.getElementById('hint');
    const gameOverEl = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const tryAgainBtn = document.getElementById('tryAgainBtn');

    const W = canvas.width;
    const H = canvas.height;

    const GROUND_Y = 400;
    const PLAYER_X = 150;
    const CUBE_SIZE = 46;
    const SCROLL_SPEED = 170;
    const GRAVITY = 600;
    const JUMP_IMPULSE = 320;
    const CLIMB_SPEED = 260;
    const TOLERANCE = 14;

    let player, obstacles, particles, furthestX, holding, gameOver, lastTime, hintTimer;

    function resetGame() {
        player = { worldX: 0, height: 0, vy: 0, rotation: 0 };
        obstacles = [];
        particles = [];
        furthestX = 0;
        holding = false;
        gameOver = false;
        hintTimer = 5;
        gameOverEl.classList.remove('show');
        hintEl.style.opacity = '1';
        ensureObstacles();
        lastTime = performance.now();
        requestAnimationFrame(loop);
    }

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function ensureObstacles() {
        const lookAhead = player.worldX + (W - PLAYER_X) + 900;
        let prevType = obstacles.length ? obstacles[obstacles.length - 1].type : null;
        while (furthestX < lookAhead) {
            furthestX += rand(300, 480);
            let type = pick(['spike', 'block', 'cliff', 'spike', 'block']);
            if (type === 'cliff' && prevType === 'cliff') type = 'block';
            let ob = { type, worldX: furthestX };
            if (type === 'spike') {
                ob.width = 40; ob.height = 30;
                furthestX += ob.width;
            } else if (type === 'block') {
                ob.width = 44; ob.height = 40;
                furthestX += ob.width;
            } else if (type === 'cliff') {
                ob.rampWidth = 170; ob.platformWidth = 150; ob.platformHeight = 195;
                ob.rampEnd = ob.worldX + ob.rampWidth;
                ob.zoneEnd = ob.rampEnd + ob.platformWidth;
                furthestX = ob.zoneEnd;
            }
            obstacles.push(ob);
            prevType = type;
        }
        obstacles = obstacles.filter(o => {
            const w = o.type === 'cliff' ? o.zoneEnd - o.worldX : o.width;
            return o.worldX + w > player.worldX - 200;
        });
    }

    function findActiveCliff() {
        for (const o of obstacles) {
            if (o.type === 'cliff' && player.worldX >= o.worldX - 5 && player.worldX <= o.zoneEnd + 5) return o;
        }
        return null;
    }

    function groundLevelAt(cliff) {
        if (!cliff) return 0;
        if (player.worldX >= cliff.rampEnd && player.worldX <= cliff.zoneEnd) return cliff.platformHeight;
        return 0;
    }

    function update(dt) {
        player.worldX += SCROLL_SPEED * dt;

        if (hintTimer > 0) {
            hintTimer -= dt;
            if (hintTimer <= 0) hintEl.style.opacity = '0';
        }

        const activeCliff = findActiveCliff();
        const inRamp = activeCliff && player.worldX >= activeCliff.worldX && player.worldX < activeCliff.rampEnd;
        const G = groundLevelAt(activeCliff);

        if (holding && inRamp) {
            player.vy = CLIMB_SPEED;
            player.height += player.vy * dt;
        } else {
            player.vy -= GRAVITY * dt;
            player.height += player.vy * dt;
        }

        if (player.height < G) {
            player.height = G;
            player.vy = 0;
        }

        const isAirborne = player.height > G + 2;
        if (isAirborne && !(holding && inRamp)) {
            player.rotation += 480 * dt;
        } else {
            player.rotation = 0;
        }

        if (isAirborne && Math.random() < 0.5) {
            particles.push({ worldX: player.worldX - CUBE_SIZE / 2, height: player.height - CUBE_SIZE / 2, alpha: 0.6, size: 8 });
        }
        for (const p of particles) { p.alpha -= dt * 1.5; p.size += dt * 6; }
        particles = particles.filter(p => p.alpha > 0);

        if (inRamp) {
            const requiredClearance = activeCliff.platformHeight * (player.worldX - activeCliff.worldX) / activeCliff.rampWidth;
            if (player.height < requiredClearance - TOLERANCE) {
                crash();
                return;
            }
        }

        const cubeBottom = GROUND_Y - player.height;
        const cubeTop = cubeBottom - CUBE_SIZE;
        const cubeLeft = PLAYER_X - CUBE_SIZE / 2;
        const cubeRight = PLAYER_X + CUBE_SIZE / 2;

        for (const o of obstacles) {
            if (o.type === 'cliff') continue;
            const screenX = o.worldX - player.worldX + PLAYER_X;
            const oLeft = screenX;
            const oRight = screenX + o.width;
            const oTop = GROUND_Y - o.height;
            const oBottom = GROUND_Y;
            if (cubeRight > oLeft && cubeLeft < oRight && cubeBottom > oTop && cubeTop < oBottom) {
                crash();
                return;
            }
        }

        ensureObstacles();
        scoreEl.textContent = 'Score: ' + Math.floor(player.worldX / 12);
    }

    function crash() {
        gameOver = true;
        finalScoreEl.textContent = 'Score: ' + Math.floor(player.worldX / 12);
        gameOverEl.classList.add('show');
    }

    function drawBackground() {
        const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        grad.addColorStop(0, '#4facfe');
        grad.addColorStop(1, '#a1e9ff');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, GROUND_Y);

        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 5; i++) {
            const cx = ((i * 260) - (player.worldX * 0.25) % 1300 + 1300) % (W + 300) - 150;
            const cy = 60 + (i % 3) * 40;
            drawCloud(cx, cy);
        }
    }

    function drawCloud(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.arc(x + 24, y - 10, 26, 0, Math.PI * 2);
        ctx.arc(x + 48, y, 22, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawGround() {
        ctx.fillStyle = '#7b3fa0';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

        const checkerSize = 40;
        const offset = ((player.worldX % checkerSize) + checkerSize) % checkerSize;
        ctx.fillStyle = '#9b59d0';
        for (let x = -checkerSize; x < W + checkerSize; x += checkerSize * 2) {
            ctx.fillRect(x - offset, GROUND_Y, checkerSize, 14);
        }

        ctx.fillStyle = '#ffe066';
        ctx.fillRect(0, GROUND_Y, W, 5);
    }

    function drawSpike(screenX, width, height) {
        ctx.fillStyle = '#ff6b35';
        ctx.beginPath();
        ctx.moveTo(screenX, GROUND_Y);
        ctx.lineTo(screenX + width / 2, GROUND_Y - height);
        ctx.lineTo(screenX + width, GROUND_Y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function drawBlock(screenX, width, height) {
        ctx.fillStyle = '#2d6fe0';
        roundRect(screenX, GROUND_Y - height, width, height, 8);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function drawCliff(o) {
        const screenX = o.worldX - player.worldX + PLAYER_X;
        const steps = 6;
        ctx.fillStyle = '#ff9f1c';
        for (let i = 0; i < steps; i++) {
            const stepH = o.platformHeight * (i + 1) / steps;
            const stepX = screenX + (o.rampWidth * i) / steps;
            const stepW = o.rampWidth / steps;
            ctx.fillRect(stepX, GROUND_Y - stepH, stepW + 1, stepH);
        }
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 2;
        for (let i = 0; i < steps; i++) {
            const stepH = o.platformHeight * (i + 1) / steps;
            const stepX = screenX + (o.rampWidth * i) / steps;
            const stepW = o.rampWidth / steps;
            ctx.strokeRect(stepX, GROUND_Y - stepH, stepW, stepH);
        }

        ctx.fillStyle = '#7b3fa0';
        ctx.fillRect(screenX + o.rampWidth, GROUND_Y - o.platformHeight, o.platformWidth, o.platformHeight);
        ctx.fillStyle = '#ffe066';
        ctx.fillRect(screenX + o.rampWidth, GROUND_Y - o.platformHeight, o.platformWidth, 6);
    }

    function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function drawPlayer() {
        const x = PLAYER_X;
        const y = GROUND_Y - player.height - CUBE_SIZE / 2;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((player.rotation * Math.PI) / 180);

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        roundRect(-CUBE_SIZE / 2 + 4, -CUBE_SIZE / 2 + 6, CUBE_SIZE, CUBE_SIZE, 10);
        ctx.fill();

        const grad = ctx.createLinearGradient(-CUBE_SIZE / 2, -CUBE_SIZE / 2, CUBE_SIZE / 2, CUBE_SIZE / 2);
        grad.addColorStop(0, '#00e5ff');
        grad.addColorStop(1, '#2979ff');
        ctx.fillStyle = grad;
        roundRect(-CUBE_SIZE / 2, -CUBE_SIZE / 2, CUBE_SIZE, CUBE_SIZE, 10);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#1b1b1b';
        ctx.beginPath();
        ctx.arc(-9, -4, 4.5, 0, Math.PI * 2);
        ctx.arc(9, -4, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#1b1b1b';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 2, 9, 0.15 * Math.PI, 0.85 * Math.PI);
        ctx.stroke();

        ctx.restore();
    }

    function drawParticles() {
        for (const p of particles) {
            const screenX = p.worldX - player.worldX + PLAYER_X;
            const screenY = GROUND_Y - p.height;
            ctx.fillStyle = `rgba(0, 229, 255, ${Math.max(0, p.alpha)})`;
            ctx.fillRect(screenX - p.size / 2, screenY - p.size / 2, p.size, p.size);
        }
    }

    function draw() {
        drawBackground();
        drawGround();

        for (const o of obstacles) {
            const screenX = o.worldX - player.worldX + PLAYER_X;
            if (screenX > W + 250 || screenX < -300) continue;
            if (o.type === 'spike') drawSpike(screenX, o.width, o.height);
            else if (o.type === 'block') drawBlock(screenX, o.width, o.height);
            else if (o.type === 'cliff') drawCliff(o);
        }

        drawParticles();
        drawPlayer();
    }

    function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (!gameOver) update(dt);
        draw();

        requestAnimationFrame(loop);
    }

    function onPress(e) {
        if (e.cancelable) e.preventDefault();
        if (gameOver) return;
        holding = true;
        const activeCliff = findActiveCliff();
        const G = groundLevelAt(activeCliff);
        if (player.height <= G + 1) {
            player.vy = JUMP_IMPULSE;
        }
    }

    function onRelease(e) {
        if (e.cancelable) e.preventDefault();
        holding = false;
    }

    wrap.addEventListener('pointerdown', onPress);
    wrap.addEventListener('pointerup', onRelease);
    wrap.addEventListener('pointercancel', onRelease);
    wrap.addEventListener('pointerleave', onRelease);

    tryAgainBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        resetGame();
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            if (!holding) onPress({ cancelable: false });
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            e.preventDefault();
            onRelease({ cancelable: false });
        }
    });

    resetGame();
})();
</script>
</body>
</html>
